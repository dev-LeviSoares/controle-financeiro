services:
  postgres:
    image: postgres:16-alpine
    container_name: controle-financeiro-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: controle_user
      POSTGRES_PASSWORD: IE2a1fKi47DcPcPtEGhpiYaK
      POSTGRES_DB: controle_financeiro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controle_user -d controle_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
